# ============================================================================
# AurumCRM 域名站点 —— abcd.hywweb.me
#
# 放置位置：/etc/nginx/conf.d/aurum-abcd.conf（在 YOUR_SERVER_IP_2 上）
#   nginx.conf 里有 `include /etc/nginx/conf.d/*.conf;`，在 http 块内。
#
# 为什么要单独一个 server 块：
#   121 原本只有一个 `server_name _` 的块，它是**通配兜底** ——
#   任何 Host 打过来都能命中，所以【用 IP 访问】和【用域名访问】走的是同一份配置。
#   现在要上 HTTPS，就必须按域名精确匹配才能挂证书，于是拆出来。
#
#   拆完之后：
#     - Host 是 abcd.hywweb.me  →  走本文件（80 跳转 / 443 服务）
#     - 其它（含直接用 IP 访问） →  仍然落到那个 `server_name _` 的块
#   ⚠️ 所以【不要】在这里声明 default_server，否则会把 IP 访问那条路抢过来。
#
# 关于备案（这一条是这份配置能存在的原因）：
#   `hywweb.me` 已备案，`abcd.hywweb.me` 是它的子域 —— 实测**不被云厂商拦截**。
#   对照组：`example.com`（自己的域名、未备案）在阿里云和京东云**都被拦**（403）。
#   所以子域能通靠的是主域的备案，不是"子域就不用备案"。
#
# 建立时间：2026-09-15
# ============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name abcd.hywweb.me www.abcd.hywweb.me;

    # ⚠️ 这里【故意不跳 HTTPS】，而是直接提供内容。
    #
    #    原因：阿里云 121 这台的安全组**没有放行 443**（只有 80 和 8080），
    #    所以外网访问 https:// 一律连不上。此时若把 80 配成 `return 301`
    #    跳过去，结果是【两个端口都不可用】—— 跳到一条死路上。
    #
    #    2026-09-15 踩过一次：配完跳转后 `http://abcd.hywweb.me/` 从 200 变 301，
    #    而 301 的目标 https 又连不上，整个域名等于废了。
    #
    #    ✅ 等控制台放行 443 之后，再把这里改成：
    #         return 301 https://$host$request_uri;
    #       （或者干脆保持现状也行 —— 两个端口都能用，只是不强制加密）

    access_log /var/log/nginx/aurum-access.log main;
    error_log  /var/log/nginx/aurum-error.log;

    root  /usr/share/nginx/html/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend-cluster/;

        # ⚠️ 【不能用 $host】—— 这是一个真实踩过的坑，见下。
        #
        # 起因：两台后端在【不同的云】上（121 阿里云 / 148 京东云），
        #      而两家的备案核查都会拦「解析到自己机房、但没在自己这儿备案」的域名。
        #
        # 若写成 `proxy_set_header Host $host;`，转发给上游的 Host 就是
        # 公网域名 abcd.hywweb.me —— 请求落到 148 时，京东云看到这个域名
        # 没备案，直接返回它的拦截页（403，页面里是 illegalitydomain.jcloud.com）。
        #
        # 症状极具迷惑性：**阿里云的机器返回了京东云的拦截页**，而负载均衡是轮询的，
        # 所以表现为【一半请求 200、一半 403】，而且只在走域名时出现
        # —— 用 IP 访问 `$host` 就是 IP 字面量，反而不触发检查。
        #
        # 用 $proxy_host：它是 proxy_pass 里写的那个名字（这里是 upstream 组名
        # `backend-cluster`），不含点、不像域名，两家的检查都不触发。
        # 后端不依赖 Host 做路由，所以换个值不影响功能。
        proxy_set_header Host              $proxy_host;

        # 真实域名挪到这里保留，应用若需要拼绝对 URL 可以从它取。
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Upstream-Addr $upstream_addr always;

        client_max_body_size 50m;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}

server {
    # ⚠️ 必须用 `listen 443 ssl http2;` 这种老写法。
    #    新写法 `http2 on;` 是 nginx 1.25.1 才引入的，这台是 1.20.1。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name abcd.hywweb.me www.abcd.hywweb.me;

    ssl_certificate     /etc/nginx/ssl/abcd.hywweb.me.pem;
    ssl_certificate_key /etc/nginx/ssl/abcd.hywweb.me.key;

    # ⚠️ 不能带 TLSv1.3：这台 nginx 是用系统 OpenSSL 1.0.2k（2017）编的，
    #    它不认 TLSv1.3，写进去 `nginx -t` 直接报 invalid value。
    ssl_protocols             TLSv1.2;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    access_log /var/log/nginx/aurum-access.log main;
    error_log  /var/log/nginx/aurum-error.log;

    root  /usr/share/nginx/html/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # ⚠️ 末尾斜杠必须留 —— 它负责剥掉 /api 前缀。
        #    前端 VITE_APP_BASE_API=/api，而后端接口本身没有 /api 这一层。
        #    少了斜杠：所有请求 404，且后端日志里一条记录都没有。
        #
        # upstream `backend-cluster` 定义在 /etc/nginx/nginx.conf 里，
        # 两台节点都在（121 自己和 YOUR_SERVER_IP）。
        proxy_pass http://backend-cluster/;

        # ⚠️ 【不能用 $host】—— 这是一个真实踩过的坑，见下。
        #
        # 起因：两台后端在【不同的云】上（121 阿里云 / 148 京东云），
        #      而两家的备案核查都会拦「解析到自己机房、但没在自己这儿备案」的域名。
        #
        # 若写成 `proxy_set_header Host $host;`，转发给上游的 Host 就是
        # 公网域名 abcd.hywweb.me —— 请求落到 148 时，京东云看到这个域名
        # 没备案，直接返回它的拦截页（403，页面里是 illegalitydomain.jcloud.com）。
        #
        # 症状极具迷惑性：**阿里云的机器返回了京东云的拦截页**，而负载均衡是轮询的，
        # 所以表现为【一半请求 200、一半 403】，而且只在走域名时出现
        # —— 用 IP 访问 `$host` 就是 IP 字面量，反而不触发检查。
        #
        # 用 $proxy_host：它是 proxy_pass 里写的那个名字（这里是 upstream 组名
        # `backend-cluster`），不含点、不像域名，两家的检查都不触发。
        # 后端不依赖 Host 做路由，所以换个值不影响功能。
        proxy_set_header Host              $proxy_host;

        # 真实域名挪到这里保留，应用若需要拼绝对 URL 可以从它取。
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 前端这次请求落到了哪台后端 —— 没有它，负载均衡是看不出来的
        # （两台返回的 body 一模一样）。逗号分隔 = 前者失败过、重试到了后者。
        add_header X-Upstream-Addr $upstream_addr always;

        # nginx 默认 1M，而后端配的是 multipart 50MB / 100MB。
        client_max_body_size 50m;

        # AI 小助手是 SSE 流式返回，缓冲会让它「憋着一句话都不出」。
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}
