# ============================================================================
# AurumCRM 站点配置
# 放置位置：/etc/nginx/conf.d/aurum-crm.conf
#   （nginx.conf 里有 `include /etc/nginx/conf.d/*.conf;`，在 http 块内）
#
# 三个 server 块，按 nginx 的匹配顺序各管一件事：
#
#   ① 80 + 域名      → 301 跳到 HTTPS
#   ② 80 + default   → 用 IP 访问时【直接提供内容】
#                      走 IP 时是纯 HTTP，浏览器不弹证书警告
#   ③ 443 + 域名     → HTTPS 正式入口
#
#   nginx 先按 server_name 精确匹配，匹配不到才落到 default_server，
#   所以 ① 和 ② 不会打架。
#
# 共用片段：/etc/nginx/snippets/aurum-api.inc
#   ⚠️ 它【故意】不放在 conf.d 下 —— 那里会被 `include conf.d/*.conf` 收走，
#      而一个 location 块出现在 http 层级会直接 [emerg] 起不来。
#      这也是它用 .inc 后缀的原因。
#
# ⚠️ 关于原来的「星海智伴」站点：
#   nginx.conf 里那个 `server_name _` 的块服务的是它。本文件把 80 端口的
#   default_server 抢了过来，所以它【不再接收任何流量】——
#   2026-09-15 用户确认不再需要该项目。
#
#   它的配置和静态文件（/usr/share/nginx/html/dist）都【原样保留，一个没删】。
#   要恢复：删掉本文件 ② 号块里的两处 default_server，reload 即可。
#
# 前置条件：
#   - 前端产物在 /usr/share/nginx/html/aurum/
#   - 证书在 /etc/nginx/ssl/example.com.{pem,key}
#   - 两台后端都活着（见下面 upstream）
#
# 建立时间：2026-09-15
# ============================================================================

# ---------------------------------------------------------------------------
# 后端集群
#
# ⚠️ upstream 必须写在 http 层级 —— 也就是【server 块之外】。
#    塞进 server 里会直接 [emerg] 起不来，这一条和 location 只能写在
#    server 里正好相反。
#
# 两个节点：
#   127.0.0.1:8080       本机（YOUR_SERVER_IP），同机还有 MySQL / Redis
#   YOUR_SERVER_IP_2:8080  第二台，数据层走公网连回本机
#
# ⚠️ 加节点前先确认那台的 8080 真的活着（`ss -ltnp | grep 8080`）。
#    挂一个连不上的节点进去，功能上不会报错（靠 proxy_next_upstream 重试
#    兜底），但每个命中死节点的请求都要先失败一次；而且「连接被拒」这种
#    快失败攒不满 max_fails 的计数下限，死节点可能一直摘不掉。
# ---------------------------------------------------------------------------
# ⚠️ 名字里【不能用下划线】。
#    location 里写的是 `proxy_set_header Host $proxy_host;`，而 $proxy_host
#    就是这个名字本身。下划线不是合法的主机名字符，Tomcat 收到
#    `Host: aurum_backend` 会直接回 **400 Bad Request**（实测确认）。
#    用连字符就没问题 —— 隔壁 121 那台叫 `backend-cluster`，所以一直没暴露。
#
#    症状很隐蔽：**只有走这台 nginx 的请求坏，直连后端却是好的**，
#    而且 400 是 Tomcat 直接拒的，应用日志里一条都不留。
upstream aurum-backend {
    server 127.0.0.1:8080;
    server YOUR_SERVER_IP_2:8080;

    # 复用长连接，省掉每次请求的 TCP 握手。
    # ⚠️ 写了它就必须在 location 里清掉 Connection 头（见 aurum-api.inc），
    #    否则 keepalive 不生效，等于白写。
    keepalive 32;
}

# ---------------------------------------------------------------------------
# ① 域名走 HTTP → 强制跳 HTTPS
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name example.com www.example.com;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# ② 默认站点：用 IP 访问时直接给内容（纯 HTTP，零证书警告）
# ---------------------------------------------------------------------------
server {
    # ⚠️ default_server 每个端口只能有一个，而 nginx.conf 里那个块原本也
    #    声明了 —— 两者冲突。所以本文件上线时必须把 nginx.conf 里那两行
    #    去掉（已做，见部署记录 /etc/nginx/nginx.conf.bak-20260915）。
    listen      80 default_server;
    listen      [::]:80 default_server;

    # ⚠️ 这里【故意不写 server_name】。
    #    省略时 nginx 把它当作 ""，配合 default_server 就是「谁都不匹配时
    #    走这里」—— 正是我们要的。
    #    如果写成 `server_name _;`，会和 nginx.conf 里那个块重名，每次
    #    reload 都刷两条 `[warn] conflicting server name "_"`。警告本身不
    #    影响行为，但会让 nginx -t 的输出变脏，日后真问题容易被淹掉。

    # 单独记日志：默认 access.log 里混着别的站点，排查问题时分不清。
    access_log /var/log/nginx/aurum-access.log main;
    error_log  /var/log/nginx/aurum-error.log;

    root  /usr/share/nginx/html/aurum;
    index index.html;

    location / {
        # 前端用 hash 路由（createWebHashHistory），本身不需要回退；
        # 但根路径 / 需要 index 兜底，否则 nginx 返回 403。
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/snippets/aurum-api.inc;
}

# ---------------------------------------------------------------------------
# ③ 域名走 HTTPS（等京东云接入备案办下来之后才会真正有外网流量进来）
# ---------------------------------------------------------------------------
server {
    # ⚠️ 必须用 `listen 443 ssl http2;` 这种老写法。
    #    新写法 `http2 on;` 是 nginx 1.25.1 才引入的，这台是 1.20.1，
    #    写了会 [emerg] 起不来。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    # ⚠️ 不能带 TLSv1.3。
    #    这台 nginx 是拿系统 OpenSSL 1.0.2k（2017）编的，不认 TLSv1.3，
    #    写进去 `nginx -t` 直接报 invalid value。
    #    想上 TLS 1.3 得换 nginx 或升级系统，不是改这一行能解决的。
    ssl_protocols             TLSv1.2;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    access_log /var/log/nginx/aurum-access.log main;
    error_log  /var/log/nginx/aurum-error.log;

    root  /usr/share/nginx/html/aurum;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/snippets/aurum-api.inc;
}
